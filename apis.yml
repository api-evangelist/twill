aid: twill
name: Twill
description: Twill is a referral-based recruiting platform with the tagline "talent
  recommended talent." It makes hiring easier and faster by having a network of more
  than 50,000 vetted, experienced professionals across engineering, product, sales,
  and growth recommend their peers and friends for open roles, producing warm introductions
  to passive candidates instead of recruiter cold outreach. Twill advertises an average
  22-day time to hire, a 90-day retention guarantee on placements, flat-fee pricing,
  and intelligent matching built in partnership with MIT's Generative AI Lab. The
  company is backed by Bloomberg Beta and does not currently publish a public developer
  API or API documentation; api.withtwill.com serves its private platform backend.
